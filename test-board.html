<style>
:root{--bg:#FDF8F0;--card:#fff;--ink:#3A3A3A;--mute:#6f6a62;--line:#e8e0d2;--teal:#4A9EA6;--teal-ink:#2f7179;--gold:#D99A4E;--chip:#f3ece0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f20;--card:#26292a;--ink:#ece6dc;--mute:#a9a296;--line:#3a3d3e;--teal:#5fb5bd;--teal-ink:#8fd0d6;--gold:#e3ad6a;--chip:#303435}}
:root[data-theme="dark"]{--bg:#1d1f20;--card:#26292a;--ink:#ece6dc;--mute:#a9a296;--line:#3a3d3e;--teal:#5fb5bd;--teal-ink:#8fd0d6;--gold:#e3ad6a;--chip:#303435}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.4 "DM Sans",system-ui,sans-serif}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1300px;margin:0 auto}
h1{font:700 30px "Playfair Display",serif;margin:0;color:var(--teal-ink)}
.sp{flex:1}
.lang{display:flex;border:2px solid var(--teal);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--teal-ink);font:700 18px "DM Sans",sans-serif;padding:10px 20px;min-height:52px;cursor:pointer}
.lang button.on{background:var(--teal);color:#fff}
.searchrow{max-width:1300px;margin:12px auto 0;position:relative}
#q{width:100%;font:500 26px "DM Sans",sans-serif;color:var(--ink);background:var(--card);border:3px solid var(--teal);border-radius:16px;padding:16px 56px 16px 20px;min-height:68px}
#clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:30px;color:var(--mute);cursor:pointer;min-width:48px;min-height:48px}
.hint{max-width:1300px;margin:8px auto 0;display:flex;gap:8px;flex-wrap:wrap}

main{max-width:1300px;margin:0 auto;padding:18px 20px 40px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:170px}
.card:hover,.card:focus-visible{border-color:var(--teal);outline:none}
.card .pic{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#000;display:block}
.cats{max-width:1300px;margin:10px auto 0;display:flex;flex-direction:column;gap:6px}
.cats .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cats .lbl{font-size:14px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;min-width:120px}
.cats button{font:600 17px "DM Sans",sans-serif;background:var(--chip);color:var(--ink);border:2px solid transparent;border-radius:999px;padding:8px 14px;min-height:46px;cursor:pointer}
.cats button.on{border-color:var(--teal);background:var(--card)}
.cats .rise button{background:#efe6f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cats .rise button{background:#3a3340}}
.card .k{font-size:15px;font-weight:700;color:var(--teal-ink);text-transform:uppercase;letter-spacing:.08em}
.card .n{font:700 28px "Playfair Display",serif}
.card .d{font-size:17px;color:var(--mute)}
.card .play{margin-top:auto;font-weight:700;color:var(--teal-ink)}
.gold{display:inline-block;font-size:13px;font-weight:700;background:var(--gold);color:#222;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.empty{font-size:22px;color:var(--mute);padding:30px 0}
#player{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#player.on{display:flex}
#player video{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;background:#000}
#player .bar{flex:0 0 auto}
#player .bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#111;color:#fff}
#player .bar button{font:700 18px "DM Sans",sans-serif;border:0;border-radius:12px;padding:10px 18px;min-height:52px;cursor:pointer}
#close{background:#fff;color:#111}
#ptitle{font:700 22px "DM Sans",sans-serif}
#cap{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);max-width:88%;text-align:center;font:700 clamp(22px,3.2vw,44px)/1.25 "DM Sans",sans-serif;color:#fff;background:rgba(0,0,0,.72);padding:10px 22px;border-radius:14px;pointer-events:none;display:none}
.note{max-width:1300px;margin:0 auto;padding:0 20px 30px;font-size:15px;color:var(--mute)}

<script>
const GH='https://trevorvaughan-ux.github.io/hanuman-demo/assets/video/';
const VTT={"nameit": {"en": "WEBVTT\n\n00:00:04.000 --> 00:00:05.048\nHi, friends!\n\n00:00:06.300 --> 00:00:08.791\nSit tall, feet flat on the floor.\n\n00:00:11.000 --> 00:00:13.691\nToday I brought… a surprise.\n\n00:00:17.300 --> 00:00:20.196\nUh-oh. A big feeling showed up.\n\n00:00:25.000 --> 00:00:26.781\nLet’s be feeling detectives.\n\n00:00:28.000 --> 00:00:29.617\nWhere is it in my body?\n\n00:00:30.500 --> 00:00:32.424\nTight fists… hot cheeks…\n\n00:00:34.000 --> 00:00:35.818\nGently squeeze your hands.\n\n00:00:38.618 --> 00:00:39.645\nAnd let go.\n\n00:00:44.000 --> 00:00:45.711\nEvery feeling has a name.\n\n00:00:47.400 --> 00:00:49.038\nSad? Worried?\n\n00:00:51.000 --> 00:00:52.789\nI think… it’s frustrated.\n\n00:00:56.600 --> 00:01:00.635\nWhoa! When we name a feeling, it gets a\nlittle smaller.\n\n00:01:01.300 --> 00:01:04.627\nYour turn: whisper your feeling’s name into\nyour hands.\n\n00:01:06.427 --> 00:01:08.520\nHands flat. Eyes closed.\n\n00:01:10.000 --> 00:01:13.940\nSmell the flower… 2, 3, 4.\n\n00:01:14.000 --> 00:01:19.940\nBlow out the cloud… 2, 3, 4, 5, 6.\n\n00:01:20.000 --> 00:01:23.940\nSmell the flower… 2, 3, 4.\n\n00:01:24.000 --> 00:01:29.940\nBlow out the cloud… 2, 3, 4, 5, 6.\n\n00:01:30.000 --> 00:01:33.940\nSmell the flower… 2, 3, 4.\n\n00:01:34.000 --> 00:01:39.940\nBlow out the cloud… 2, 3, 4, 5, 6.\n\n00:01:40.000 --> 00:01:43.940\nSmell the flower… 2, 3, 4.\n\n00:01:44.000 --> 00:01:49.940\nBlow out the cloud… 2, 3, 4, 5, 6.\n\n00:01:50.000 --> 00:01:53.940\nSmell the flower… 2, 3, 4.\n\n00:01:54.000 --> 00:01:59.950\nBlow out the cloud… 2, 3, 4, 5, 6.\n\n00:02:05.500 --> 00:02:08.025\nI named it. I tamed it.\n\n00:02:09.500 --> 00:02:10.697\nYou can too!\n\n00:02:12.000 --> 00:02:15.651\nHands back, eyes up, ready to learn.\n\n", "es": "WEBVTT\n\n00:00:04.000 --> 00:00:05.185\n¡Hola, amigos!\n\n00:00:06.300 --> 00:00:09.866\nSiéntense derechos, con los pies bien\napoyados en el piso.\n\n00:00:11.000 --> 00:00:13.340\nHoy les traje… una sorpresa.\n\n00:00:17.300 --> 00:00:20.350\nUy… apareció una emoción muy grande.\n\n00:00:25.000 --> 00:00:27.310\nSeamos detectives de las emociones.\n\n00:00:28.000 --> 00:00:29.186\n¿Dónde la siento?\n\n00:00:30.500 --> 00:00:33.340\nPuños apretados… mejillas calientes…\n\n00:00:34.000 --> 00:00:35.857\nAprieta tus manos suavemente.\n\n00:00:38.657 --> 00:00:39.436\nY suelta.\n\n00:00:44.000 --> 00:00:45.624\nCada emoción tiene un nombre.\n\n00:00:47.400 --> 00:00:49.355\n¿Tristeza? ¿Preocupación?\n\n00:00:51.000 --> 00:00:53.249\nCreo que… es frustración.\n\n00:00:56.600 --> 00:01:00.152\n¡Mira! Al nombrar una emoción, se hace un\npoquito más pequeña.\n\n00:01:01.300 --> 00:01:04.080\nAhora tú: susurra su nombre entre tus manos.\n\n00:01:05.880 --> 00:01:08.570\nManos sobre la mesa. Ojos cerrados.\n\n00:01:10.000 --> 00:01:13.940\nHuele la flor… 2, 3, 4.\n\n00:01:14.000 --> 00:01:19.940\nSopla la nube… 2, 3, 4, 5, 6.\n\n00:01:20.000 --> 00:01:23.940\nHuele la flor… 2, 3, 4.\n\n00:01:24.000 --> 00:01:29.940\nSopla la nube… 2, 3, 4, 5, 6.\n\n00:01:30.000 --> 00:01:33.940\nHuele la flor… 2, 3, 4.\n\n00:01:34.000 --> 00:01:39.940\nSopla la nube… 2, 3, 4, 5, 6.\n\n00:01:40.000 --> 00:01:43.940\nHuele la flor… 2, 3, 4.\n\n00:01:44.000 --> 00:01:49.940\nSopla la nube… 2, 3, 4, 5, 6.\n\n00:01:50.000 --> 00:01:53.940\nHuele la flor… 2, 3, 4.\n\n00:01:54.000 --> 00:01:59.950\nSopla la nube… 2, 3, 4, 5, 6.\n\n00:02:05.500 --> 00:02:08.104\nLe puse nombre… y me calmé.\n\n00:02:09.500 --> 00:02:10.734\n¡Tú también puedes!\n\n00:02:12.000 --> 00:02:16.594\nManos listas, mirada al frente. Estamos\nlistos para aprender.\n\n"}, "heavy": {"en": "WEBVTT\n\n00:00:00.000 --> 00:00:04.237\nHi, I'm Hani. Sometimes our bodies have extra wiggly energy, and the best way out is through strong, steady pushing. Stay right in your seat for this one, we don't need a wall.\n\n00:00:04.237 --> 00:00:10.592\nSit tall, and press your two palms together hard, right in front of your chest.\n\n00:00:10.592 --> 00:00:17.653\nPush your hands into each other as hard as you can. Push, push, push!\n\n00:00:17.653 --> 00:00:24.008\nBreathe out slow while you push. Strong and steady, not fast.\n\n00:00:24.008 --> 00:00:30.363\nNow stop pushing, and shake your hands out loose. Let them go floppy like noodles.\n\n00:00:30.363 --> 00:00:37.424\nNow hook your hands under the edge of your chair seat, and pull straight up, hard, like you're trying to lift the chair.\n\n00:00:37.424 --> 00:00:43.073\nBreathe out slow the whole time you're pulling.\n\n00:00:43.073 --> 00:00:48.722\nStop, and shake your hands out again.\n\n00:00:48.722 --> 00:00:56.490\nNotice how your arms feel now. A little tired is different from wiggly. Tired muscles are calm muscles.\n\n00:00:56.490 --> 00:01:04.257\nRest your hands in your lap whenever you're ready. Your body just did some real work, and your brain gets to feel calmer because of it.\n\n00:01:04.257 --> 00:01:07.788\nThat's the Heavy Work Reset. Anytime your body feels too wiggly, strong pushing helps it find calm again, no wall required.\n", "es": "WEBVTT\n\n00:00:00.000 --> 00:00:05.273\nHola, soy Hani. A veces nuestro cuerpo tiene energía extra inquieta, y la mejor forma de soltarla es empujar fuerte y parejo. Quédate en tu asiento; no necesitamos una pared.\n\n00:00:05.273 --> 00:00:13.184\nSiéntate derecho y presiona tus palmas con fuerza, justo frente a tu pecho.\n\n00:00:13.184 --> 00:00:21.973\nEmpuja una mano contra la otra con toda tu fuerza. ¡Empuja, empuja, empuja!\n\n00:00:21.973 --> 00:00:29.883\nExhala despacio mientras empujas. Fuerte y estable, no rápido.\n\n00:00:29.883 --> 00:00:37.793\nAhora deja de empujar y sacude las manos. Déjalas flojitas como fideos.\n\n00:00:37.793 --> 00:00:46.582\nAhora engancha las manos debajo del borde de tu asiento y jala hacia arriba con fuerza, como si quisieras levantar la silla.\n\n00:00:46.582 --> 00:00:53.614\nExhala despacio durante todo el tiempo que estás tirando.\n\n00:00:53.614 --> 00:01:00.645\nPara, y sacude las manos de nuevo.\n\n00:01:00.645 --> 00:01:10.313\nFíjate cómo se sienten tus brazos. Un poco cansados no es lo mismo que inquietos. Los músculos cansados son músculos tranquilos.\n\n00:01:10.313 --> 00:01:19.981\nDescansa las manos sobre tus piernas cuando estés listo. Tu cuerpo acaba de hacer un trabajo real, y tu cerebro se siente más calmado por ello.\n\n00:01:19.981 --> 00:01:24.376\nEse fue el Reinicio de Trabajo Pesado. Cuando tu cuerpo esté muy inquieto, empujar fuerte le ayuda a encontrar la calma otra vez, sin necesidad de pared.\n"}, "chair": {"en": "WEBVTT\n\n00:00:00.000 --> 00:00:06.000\nChair Pose — with Hani\n\n00:00:06.000 --> 00:00:09.520\nBreathe in... Reach your arms up high.\n\n00:00:09.520 --> 00:00:13.040\nBreathe out... Bend your knees. Sit back.\n\n00:00:13.040 --> 00:00:17.560\nBreathe in... Lean forward just a little.\n\n00:00:17.560 --> 00:00:22.080\nBreathe out... Ears between your arms.\n\n00:00:22.080 --> 00:00:26.600\nBreathe in... Knees and feet together.\n\n00:00:26.600 --> 00:00:31.120\nBreathe out... Keep breathing slowly.\n\n00:00:31.120 --> 00:00:34.640\nBreathe in... Stand up tall.\n\n00:00:34.640 --> 00:00:38.160\nBreathe out... Arms down by your sides.\n\n00:00:38.160 --> 00:00:41.680\nBreathe in... Arms up again.\n\n00:00:41.680 --> 00:00:45.200\nBreathe out... Sit back in your chair.\n\n00:00:45.200 --> 00:00:49.720\nBreathe in... Look straight ahead.\n\n00:00:49.720 --> 00:00:54.240\nBreathe out... Strong, steady legs.\n\n00:00:54.240 --> 00:00:58.760\nBreathe in... Arms in line with your back.\n\n00:00:58.760 --> 00:01:03.280\nBreathe out... You are doing great!\n\n00:01:03.280 --> 00:01:06.800\nBreathe in... Push up to stand.\n\n00:01:06.800 --> 00:01:10.320\nBreathe out... Lower your arms.\n\n00:01:10.320 --> 00:01:19.320\nFun fact! Your leg muscles are some of the strongest in your body. They help you jump and climb!\n\n00:01:19.320 --> 00:01:22.840\nBreathe in... Reach up high.\n\n00:01:22.840 --> 00:01:26.360\nBreathe out... Bend your knees. Hips back.\n\n00:01:26.360 --> 00:01:30.880\nBreathe in... Feel your legs working.\n\n00:01:30.880 --> 00:01:35.400\nBreathe out... Long, straight back.\n\n00:01:35.400 --> 00:01:39.920\nBreathe in... Fingers reach up.\n\n00:01:39.920 --> 00:01:44.440\nBreathe out... Hold. Almost there.\n\n00:01:44.440 --> 00:01:47.960\nBreathe in... Stand up slowly.\n\n00:01:47.960 --> 00:01:51.480\nBreathe out... Arms down. Relax.\n\n00:01:51.480 --> 00:01:55.000\nBreathe in... One last time. Arms up.\n\n00:01:55.000 --> 00:01:58.520\nBreathe out... Bend your knees. Sit back.\n\n00:01:58.520 --> 00:02:03.040\nBreathe in... Strong like a chair.\n\n00:02:03.040 --> 00:02:07.560\nBreathe out... Breathe nice and slow.\n\n00:02:07.560 --> 00:02:12.080\nBreathe in... Last hold. You can do it!\n\n00:02:12.080 --> 00:02:16.600\nBreathe out... Proud and strong.\n\n00:02:16.600 --> 00:02:20.120\nBreathe in... Stand up tall.\n\n00:02:20.120 --> 00:02:23.640\nBreathe out... Arms down. Great job!\n\n00:02:23.640 --> 00:02:29.640\nNice work! You did Chair Pose. HudsonSeed · Hani\n", "es": "WEBVTT\n\n00:00:00.000 --> 00:00:06.000\nPostura de la Silla — con Hani\n\n00:00:06.000 --> 00:00:09.520\nInhala... Sube los brazos bien alto.\n\n00:00:09.520 --> 00:00:13.040\nExhala... Dobla las rodillas. Siéntate atrás.\n\n00:00:13.040 --> 00:00:17.560\nInhala... Inclínate un poquito hacia adelante.\n\n00:00:17.560 --> 00:00:22.080\nExhala... Orejas entre los brazos.\n\n00:00:22.080 --> 00:00:26.600\nInhala... Rodillas y pies juntos.\n\n00:00:26.600 --> 00:00:31.120\nExhala... Sigue respirando despacio.\n\n00:00:31.120 --> 00:00:34.640\nInhala... Párate derecho.\n\n00:00:34.640 --> 00:00:38.160\nExhala... Brazos abajo a los lados.\n\n00:00:38.160 --> 00:00:41.680\nInhala... Brazos arriba otra vez.\n\n00:00:41.680 --> 00:00:45.200\nExhala... Siéntate atrás en tu silla.\n\n00:00:45.200 --> 00:00:49.720\nInhala... Mira hacia adelante.\n\n00:00:49.720 --> 00:00:54.240\nExhala... Piernas fuertes y firmes.\n\n00:00:54.240 --> 00:00:58.760\nInhala... Brazos en línea con tu espalda.\n\n00:00:58.760 --> 00:01:03.280\nExhala... ¡Lo estás haciendo muy bien!\n\n00:01:03.280 --> 00:01:06.800\nInhala... Empuja para pararte.\n\n00:01:06.800 --> 00:01:10.320\nExhala... Baja los brazos.\n\n00:01:10.320 --> 00:01:19.320\n¡Dato curioso! Los músculos de tus piernas están entre los más fuertes de tu cuerpo. ¡Te ayudan a saltar y trepar!\n\n00:01:19.320 --> 00:01:22.840\nInhala... Estírate bien alto.\n\n00:01:22.840 --> 00:01:26.360\nExhala... Dobla las rodillas. Cadera atrás.\n\n00:01:26.360 --> 00:01:30.880\nInhala... Siente cómo trabajan tus piernas.\n\n00:01:30.880 --> 00:01:35.400\nExhala... Espalda larga y recta.\n\n00:01:35.400 --> 00:01:39.920\nInhala... Los dedos hacia arriba.\n\n00:01:39.920 --> 00:01:44.440\nExhala... Aguanta. Ya casi.\n\n00:01:44.440 --> 00:01:47.960\nInhala... Párate despacio.\n\n00:01:47.960 --> 00:01:51.480\nExhala... Brazos abajo. Relájate.\n\n00:01:51.480 --> 00:01:55.000\nInhala... Una última vez. Brazos arriba.\n\n00:01:55.000 --> 00:01:58.520\nExhala... Dobla las rodillas. Siéntate atrás.\n\n00:01:58.520 --> 00:02:03.040\nInhala... Fuerte como una silla.\n\n00:02:03.040 --> 00:02:07.560\nExhala... Respira lento y suave.\n\n00:02:07.560 --> 00:02:12.080\nInhala... ¡Último aguante, tú puedes!\n\n00:02:12.080 --> 00:02:16.600\nExhala... Orgulloso y fuerte.\n\n00:02:16.600 --> 00:02:20.120\nInhala... Párate derecho.\n\n00:02:20.120 --> 00:02:23.640\nExhala... Brazos abajo. ¡Muy bien!\n\n00:02:23.640 --> 00:02:29.640\n¡Muy bien! Hiciste la postura de la Silla. HudsonSeed · Hani\n"}, "mountain": {"en": "WEBVTT\n\n00:00:00.000 --> 00:00:06.000\nMountain Pose — with Hani\n\n00:00:06.000 --> 00:00:11.500\nBreathe in... Stand tall. Feet together.\n\n00:00:11.500 --> 00:00:16.000\nBreathe out... Arms by your sides.\n\n00:00:16.000 --> 00:00:19.800\nBreathe in... Palms face forward.\n\n00:00:19.800 --> 00:00:24.800\nBreathe out... Feel your feet on the floor.\n\n00:00:24.800 --> 00:00:28.600\nBreathe in... Grow tall like a mountain.\n\n00:00:28.600 --> 00:00:34.000\nBreathe out... Shoulders soft and low.\n\n00:00:34.000 --> 00:00:37.700\nBreathe in... Fill up slowly.\n\n00:00:37.700 --> 00:00:43.200\nBreathe out... Let it all go.\n\n00:00:43.200 --> 00:00:48.700\nBreathe in... Feel strong and steady.\n\n00:00:48.700 --> 00:00:52.400\nBreathe out... Feel calm inside.\n\n00:00:52.400 --> 00:00:57.800\nBreathe in... Like a big mountain.\n\n00:00:57.800 --> 00:01:01.600\nBreathe out... Nothing can push you over.\n\n00:01:01.600 --> 00:01:06.600\nBreathe in... Slow and deep.\n\n00:01:06.600 --> 00:01:10.400\nBreathe out... Nice and slow.\n\n00:01:10.400 --> 00:01:14.900\nBreathe in... Your mountain is strong.\n\n00:01:14.900 --> 00:01:20.400\nBreathe out... Your mountain is calm.\n\n00:01:20.400 --> 00:01:29.400\nFun fact! Mountains stay steady and strong, even when the wind blows!\n\n00:01:29.400 --> 00:01:34.900\nBreathe in... Close your eyes, or look down.\n\n00:01:34.900 --> 00:01:39.400\nBreathe out... Soft, quiet body.\n\n00:01:39.400 --> 00:01:43.200\nBreathe in... Feel the sun on your mountain.\n\n00:01:43.200 --> 00:01:48.200\nBreathe out... Let the clouds float by.\n\n00:01:48.200 --> 00:01:52.000\nBreathe in... Breathe in calm.\n\n00:01:52.000 --> 00:01:57.400\nBreathe out... Breathe out worries.\n\n00:01:57.400 --> 00:02:01.100\nBreathe in... Tall and proud.\n\n00:02:01.100 --> 00:02:06.600\nBreathe out... Steady and still.\n\n00:02:06.600 --> 00:02:12.100\nBreathe in... Almost done.\n\n00:02:12.100 --> 00:02:15.800\nBreathe out... Slow and easy.\n\n00:02:15.800 --> 00:02:21.200\nBreathe in... One more big breath.\n\n00:02:21.200 --> 00:02:25.000\nBreathe out... All the way out.\n\n00:02:25.000 --> 00:02:30.000\nBreathe in... Wiggle your fingers.\n\n00:02:30.000 --> 00:02:33.800\nBreathe out... Open your eyes.\n\n00:02:33.800 --> 00:02:38.300\nBreathe in... You are a mountain!\n\n00:02:38.300 --> 00:02:43.800\nBreathe out... Great job, friend!\n\n00:02:43.800 --> 00:02:49.800\nNice work! You did Mountain Pose. HudsonSeed · Hani\n", "es": "WEBVTT\n\n00:00:00.000 --> 00:00:06.000\nPostura de la Montaña — con Hani\n\n00:00:06.000 --> 00:00:11.500\nInhala... Párate alto. Junta los pies.\n\n00:00:11.500 --> 00:00:16.000\nExhala... Brazos a los lados.\n\n00:00:16.000 --> 00:00:19.800\nInhala... Palmas hacia adelante.\n\n00:00:19.800 --> 00:00:24.800\nExhala... Siente tus pies en el piso.\n\n00:00:24.800 --> 00:00:28.600\nInhala... Crece alto como una montaña.\n\n00:00:28.600 --> 00:00:34.000\nExhala... Hombros suaves y relajados.\n\n00:00:34.000 --> 00:00:37.700\nInhala... Llénate despacito.\n\n00:00:37.700 --> 00:00:43.200\nExhala... Suéltalo todo.\n\n00:00:43.200 --> 00:00:48.700\nInhala... Siéntete fuerte y firme.\n\n00:00:48.700 --> 00:00:52.400\nExhala... Siente la calma por dentro.\n\n00:00:52.400 --> 00:00:57.800\nInhala... Como una gran montaña.\n\n00:00:57.800 --> 00:01:01.600\nExhala... Nada te puede mover.\n\n00:01:01.600 --> 00:01:06.600\nInhala... Lento y profundo.\n\n00:01:06.600 --> 00:01:10.400\nExhala... Bien despacito.\n\n00:01:10.400 --> 00:01:14.900\nInhala... Tu montaña es fuerte.\n\n00:01:14.900 --> 00:01:20.400\nExhala... Tu montaña está tranquila.\n\n00:01:20.400 --> 00:01:29.400\n¡Dato curioso! ¡Las montañas se quedan firmes y fuertes, aunque sople el viento!\n\n00:01:29.400 --> 00:01:34.900\nInhala... Cierra los ojos, o mira hacia abajo.\n\n00:01:34.900 --> 00:01:39.400\nExhala... Cuerpo suave y quieto.\n\n00:01:39.400 --> 00:01:43.200\nInhala... Siente el sol en tu montaña.\n\n00:01:43.200 --> 00:01:48.200\nExhala... Deja pasar las nubes.\n\n00:01:48.200 --> 00:01:52.000\nInhala... Inhala calma.\n\n00:01:52.000 --> 00:01:57.400\nExhala... Exhala tus preocupaciones.\n\n00:01:57.400 --> 00:02:01.100\nInhala... Alto y orgulloso.\n\n00:02:01.100 --> 00:02:06.600\nExhala... Firme y quieto.\n\n00:02:06.600 --> 00:02:12.100\nInhala... Ya casi terminamos.\n\n00:02:12.100 --> 00:02:15.800\nExhala... Lento y tranquilo.\n\n00:02:15.800 --> 00:02:21.200\nInhala... Una respiración grande más.\n\n00:02:21.200 --> 00:02:25.000\nExhala... Suelta todo el aire.\n\n00:02:25.000 --> 00:02:30.000\nInhala... Mueve los dedos.\n\n00:02:30.000 --> 00:02:33.800\nExhala... Abre los ojos.\n\n00:02:33.800 --> 00:02:38.300\nInhala... ¡Eres una montaña!\n\n00:02:38.300 --> 00:02:43.800\nExhala... ¡Muy bien, amigo!\n\n00:02:43.800 --> 00:02:49.800\n¡Muy bien! Hiciste la postura de la Montaña. HudsonSeed · Hani\n"}, "tree": {"en": "WEBVTT\n\n00:00:00.000 --> 00:00:06.000\nTree Pose — with Hani\n\n00:00:06.000 --> 00:00:10.520\nBreathe in... Stand tall. Feet together.\n\n00:00:10.520 --> 00:00:15.040\nBreathe out... Shift your weight to one foot.\n\n00:00:15.040 --> 00:00:18.560\nBreathe in... Lift your foot to your calf.\n\n00:00:18.560 --> 00:00:22.080\nBreathe out... Hands together at your heart.\n\n00:00:22.080 --> 00:00:26.600\nBreathe in... Find a spot to look at.\n\n00:00:26.600 --> 00:00:31.120\nBreathe out... Steady like a tree.\n\n00:00:31.120 --> 00:00:35.640\nBreathe in... Roots grow into the floor.\n\n00:00:35.640 --> 00:00:40.160\nBreathe out... Strong and still.\n\n00:00:40.160 --> 00:00:44.680\nBreathe in... Get ready to grow.\n\n00:00:44.680 --> 00:00:49.200\nBreathe out... Soft and quiet body.\n\n00:00:49.200 --> 00:00:52.720\nBreathe in... Grow your branches up high!\n\n00:00:52.720 --> 00:00:57.240\nBreathe out... Soft shoulders.\n\n00:00:57.240 --> 00:01:01.760\nBreathe in... Reach for the sun.\n\n00:01:01.760 --> 00:01:06.280\nBreathe out... Wobbling is okay.\n\n00:01:06.280 --> 00:01:10.800\nBreathe in... Sway in the breeze.\n\n00:01:10.800 --> 00:01:15.320\nBreathe out... Calm, tall tree.\n\n00:01:15.320 --> 00:01:19.840\nBreathe in... One more big breath.\n\n00:01:19.840 --> 00:01:23.840\nBreathe out... Lower your arms and foot.\n\n00:01:23.840 --> 00:01:28.360\nBreathe in... Stand tall like a mountain.\n\n00:01:28.360 --> 00:01:32.880\nBreathe out... Now the other side!\n\n00:01:32.880 --> 00:01:41.880\nFun fact! Trees grow strong roots. The deeper the roots, the steadier the tree!\n\n00:01:41.880 --> 00:01:45.400\nBreathe in... Lift your other foot.\n\n00:01:45.400 --> 00:01:49.920\nBreathe out... Hands at your heart.\n\n00:01:49.920 --> 00:01:54.440\nBreathe in... Look at your spot.\n\n00:01:54.440 --> 00:01:58.960\nBreathe out... Steady roots.\n\n00:01:58.960 --> 00:02:02.480\nBreathe in... Grow your branches up high!\n\n00:02:02.480 --> 00:02:07.000\nBreathe out... Soft shoulders.\n\n00:02:07.000 --> 00:02:11.520\nBreathe in... Reach for the sun.\n\n00:02:11.520 --> 00:02:16.040\nBreathe out... Strong roots, calm mind.\n\n00:02:16.040 --> 00:02:20.560\nBreathe in... Feel tall and proud.\n\n00:02:20.560 --> 00:02:25.080\nBreathe out... Wobbling is okay.\n\n00:02:25.080 --> 00:02:28.600\nBreathe in... Get ready to come down.\n\n00:02:28.600 --> 00:02:32.600\nBreathe out... Lower your arms and foot.\n\n00:02:32.600 --> 00:02:37.120\nBreathe in... Stand tall and smile.\n\n00:02:37.120 --> 00:02:41.640\nBreathe out... Great job, tree friend!\n\n00:02:41.640 --> 00:02:47.640\nNice work! You did Tree Pose. HudsonSeed · Hani\n", "es": "WEBVTT\n\n00:00:00.000 --> 00:00:06.000\nPostura del Árbol — con Hani\n\n00:00:06.000 --> 00:00:10.520\nInhala... Párate derecho. Pies juntos.\n\n00:00:10.520 --> 00:00:15.040\nExhala... Pasa tu peso a un pie.\n\n00:00:15.040 --> 00:00:18.560\nInhala... Sube el pie a tu pantorrilla.\n\n00:00:18.560 --> 00:00:22.080\nExhala... Manos juntas en el corazón.\n\n00:00:22.080 --> 00:00:26.600\nInhala... Busca un punto para mirar.\n\n00:00:26.600 --> 00:00:31.120\nExhala... Firme como un árbol.\n\n00:00:31.120 --> 00:00:35.640\nInhala... Tus raíces crecen en el piso.\n\n00:00:35.640 --> 00:00:40.160\nExhala... Fuerte y quieto.\n\n00:00:40.160 --> 00:00:44.680\nInhala... Prepárate para crecer.\n\n00:00:44.680 --> 00:00:49.200\nExhala... Cuerpo suave y tranquilo.\n\n00:00:49.200 --> 00:00:52.720\nInhala... ¡Sube tus ramas bien alto!\n\n00:00:52.720 --> 00:00:57.240\nExhala... Hombros suaves.\n\n00:00:57.240 --> 00:01:01.760\nInhala... Alcanza el sol.\n\n00:01:01.760 --> 00:01:06.280\nExhala... Está bien tambalearse.\n\n00:01:06.280 --> 00:01:10.800\nInhala... Muévete con la brisa.\n\n00:01:10.800 --> 00:01:15.320\nExhala... Árbol alto y tranquilo.\n\n00:01:15.320 --> 00:01:19.840\nInhala... Una respiración grande más.\n\n00:01:19.840 --> 00:01:23.840\nExhala... Baja los brazos y el pie.\n\n00:01:23.840 --> 00:01:28.360\nInhala... Párate alto como una montaña.\n\n00:01:28.360 --> 00:01:32.880\nExhala... ¡Ahora el otro lado!\n\n00:01:32.880 --> 00:01:41.880\n¡Dato curioso! Los árboles crecen raíces fuertes. ¡Mientras más profundas, más firme es el árbol!\n\n00:01:41.880 --> 00:01:45.400\nInhala... Sube el otro pie.\n\n00:01:45.400 --> 00:01:49.920\nExhala... Manos en el corazón.\n\n00:01:49.920 --> 00:01:54.440\nInhala... Mira tu punto.\n\n00:01:54.440 --> 00:01:58.960\nExhala... Raíces firmes.\n\n00:01:58.960 --> 00:02:02.480\nInhala... ¡Sube tus ramas bien alto!\n\n00:02:02.480 --> 00:02:07.000\nExhala... Hombros suaves.\n\n00:02:07.000 --> 00:02:11.520\nInhala... Alcanza el sol.\n\n00:02:11.520 --> 00:02:16.040\nExhala... Raíces fuertes, mente tranquila.\n\n00:02:16.040 --> 00:02:20.560\nInhala... Siéntete alto y orgulloso.\n\n00:02:20.560 --> 00:02:25.080\nExhala... Está bien tambalearse.\n\n00:02:25.080 --> 00:02:28.600\nInhala... Prepárate para bajar.\n\n00:02:28.600 --> 00:02:32.600\nExhala... Baja los brazos y el pie.\n\n00:02:32.600 --> 00:02:37.120\nInhala... Párate alto y sonríe.\n\n00:02:37.120 --> 00:02:41.640\nExhala... ¡Muy bien, amigo árbol!\n\n00:02:41.640 --> 00:02:47.640\n¡Muy bien! Hiciste la postura del Árbol. HudsonSeed · Hani\n"}};

  const hay=' '+norm(t.tags+' '+ES_TAGS[t.id]+' '+t.name.en+' '+t.name.es+' '+t.d.en+' '+t.d.es)+' ';
  const phrase=norm(q); let s=hay.includes(' '+phrase+' ')?5:0;
  for(const w of words){ if(hay.includes(' '+w+' ')) s+=2; else if(w.length>3&&hay.includes(' '+w.slice(0,Math.max(4,w.length-2)))) s+=1; }
  return s;
}
function render(){
  document.documentElement.lang=lang;
  $('#lang-en').classList.toggle('on',lang==='en'); $('#lang-es').classList.toggle('on',lang==='es');
  $('#q').placeholder=lang==='en'?"What's happening in your class right now?":'¿Qué está pasando en tu clase ahora?';
  const chip=g=>CATS.map((c,i)=>c.g===g?`<button data-cat="${i}" class="${activeCat===i?'on':''}">${esc(c.l[lang])}</button>`:'').join('');
  $('#cats').innerHTML=`<div class="row rise"><span class="lbl">R.I.S.E.</span>${chip('rise')}</div><div class="row"><span class="lbl">${lang==='en'?'Problems':'Problemas'}</span>${chip('prob')}</div>`;
  const q=$('#q').value; const ranked=TOOLS.map(t=>({t,s:score(t,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  $('#grid').innerHTML=ranked.length?ranked.map(({t})=>`<button class="card" data-id="${t.id}"><img class="pic" src="${THUMB[t.id]}" alt="">
     <span class="k">${esc(t.kind[lang])}${t.gold?`<span class="gold">${lang==='en'?'Gold standard':'Estándar de oro'}</span>`:''}</span>
     <span class="n">${esc(t.name[lang])}</span><span class="d">${esc(t.d[lang])}</span>
     <span class="play">▶ ${lang==='en'?'Play':'Reproducir'}</span></button>`).join('')
    :`<div class="empty">${lang==='en'?'No match yet. Try a moment like "after recess" or "big feelings."':'Sin resultados. Prueba "después del recreo" o "sentimientos grandes".'}</div>`;
}
function parseVTT(s){ const out=[]; const rx=/(\d{2}:)?(\d{2}):(\d{2})\.(\d{3})\s*-->\s*(\d{2}:)?(\d{2}):(\d{2})\.(\d{3})[^\n]*\n([\s\S]*?)(?=\n\s*\n|\s*$)/g; let m;
  const sec=(h,mn,s,ms)=>(h?parseInt(h):0)*3600+parseInt(mn)*60+parseInt(s)+parseInt(ms)/1000;
  while((m=rx.exec(s.replace(/\r/g,'')))) out.push({a:sec(m[1],m[2],m[3],m[4]),b:sec(m[5],m[6],m[7],m[8]),t:m[9].trim()}); return out; }
let cues=[];
function showCap(){ const v=$('#vid'), c=$('#cap'); const t=v.currentTime; const q=cues.find(x=>t>=x.a&&t<x.b); if(q){ c.textContent=q.t; c.style.display='block' } else c.style.display='none'; }
function play(id){
  const t=TOOLS.find(x=>x.id===id); const v=$('#vid');
  v.pause(); cues=t.vtt?parseVTT(VTT[id][lang]):[]; $('#cap').style.display='none';
  v.src=t.src[lang]; $('#ptitle').textContent=t.name[lang];
  $('#player').classList.add('on'); v.play().catch(()=>{});
}
function closeP(){ const v=$('#vid'); v.pause(); cues=[]; $('#cap').style.display='none'; v.removeAttribute('src'); v.load(); $('#player').classList.remove('on'); }
document.addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(c) return play(c.dataset.id);
  const cb=e.target.closest('[data-cat]'); if(cb){ const i=+cb.dataset.cat; activeCat=(activeCat===i)?null:i; $('#q').value=''; render(); return }
});
$('#close').onclick=closeP;
$('#vid').addEventListener('timeupdate',showCap); $('#vid').addEventListener('seeked',showCap);
$('#vid').addEventListener('error',()=>{ $('#cap').textContent=(lang==='en'?'This video could not load. Check the internet connection.':'No se pudo cargar el video. Revisa la conexión a internet.'); $('#cap').style.display='block'; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#player').classList.contains('on')) closeP() });
$('#q').addEventListener('input',()=>{activeCat=null;render()});
$('#clear').onclick=()=>{ $('#q').value=''; activeCat=null; render(); $('#q').focus() };
$('#lang-en').onclick=()=>{lang='en';try{localStorage.setItem('hani_lang',lang)}catch(e){}render()};
$('#lang-es').onclick=()=>{lang='es';try{localStorage.setItem('hani_lang',lang)}catch(e){}render()};
render();
</script>
</body>
