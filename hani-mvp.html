<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Hani · Demo Board</title>
<meta name="theme-color" content="#171D3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#171D3A;--orchid:#F598FF;--mist:#E5E9FD;--peri:#94ABF9;--violet:#805A9C;--violet-d:#5A4A7A;--violet-dd:#6B4587;--display:"Playfair Display",Georgia,serif;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  html,body{min-height:100%;}
  body{background:var(--mist);color:var(--indigo);}
  button{cursor:pointer;font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--indigo);outline-offset:2px;}
  .hidden{display:none !important;}
  #topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--indigo);color:var(--mist);}
  #brand{font-family:var(--display);font-weight:700;font-size:22px;}
  #brand small{font-family:"DM Sans",sans-serif;font-size:12px;font-weight:700;background:var(--orchid);color:var(--indigo);border-radius:999px;padding:3px 8px;margin-left:8px;vertical-align:middle;}
  .langsw{display:inline-flex;border:2px solid var(--peri);border-radius:999px;overflow:hidden;}
  .langsw button{min-width:48px;min-height:48px;padding:0 14px;background:transparent;border:0;color:var(--mist);font-weight:800;font-size:16px;}
  .langsw button[aria-pressed="true"]{background:var(--orchid);color:var(--indigo);}
  #loading{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:18px;color:var(--violet-d);}
  main{max-width:1100px;margin:0 auto;padding:20px 16px 48px;}
  h1{font-family:var(--display);font-size:clamp(26px,5vw,42px);color:var(--indigo);text-align:center;}
  .sub{text-align:center;margin:8px 0 6px;font-size:clamp(15px,2vw,19px);color:var(--indigo);}
  .beta{display:block;text-align:center;font-size:14px;color:var(--violet-d);margin-bottom:18px;font-weight:700;}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;list-style:none;}
  .tile{background:#fff;border:2px solid var(--peri);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;width:100%;text-align:left;min-height:48px;padding:0;}
  .tile:hover{border-color:var(--violet);}
  .thumb{aspect-ratio:16/9;width:100%;background:linear-gradient(135deg,var(--peri),var(--orchid));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .ph{font-family:var(--display);font-size:30px;font-weight:700;color:var(--indigo);}
  .tbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;}
  .tname{font-family:var(--display);font-size:20px;font-weight:700;color:var(--indigo);}
  .tmeta{font-size:14px;color:var(--violet-d);font-weight:700;}
  .tblurb{font-size:15px;line-height:1.35;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .chip{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--indigo);color:var(--mist);}
  .chip.soft{background:var(--mist);color:var(--indigo);border:1px solid var(--violet);}
  /* player */
  #player{position:fixed;inset:0;background:var(--indigo);color:var(--mist);overflow-y:auto;z-index:20;}
  #player .inner{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
  #pback{align-self:flex-start;min-height:48px;padding:0 18px;background:transparent;border:2px solid var(--peri);color:var(--mist);border-radius:999px;font-weight:700;font-size:16px;}
  #pname{font-family:var(--display);font-size:clamp(26px,5vw,40px);}
  #pmedia{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;}
  #pmedia video,#pmedia img{width:100%;height:100%;object-fit:contain;background:#000;}
  #pmedia .ph{font-family:var(--display);font-size:44px;color:var(--indigo);background:linear-gradient(135deg,var(--peri),var(--orchid));width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  #pintro{font-size:17px;line-height:1.4;}
  #pstep{background:var(--mist);color:var(--indigo);border-radius:16px;padding:16px;}
  #pstep .cue{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:700;}
  #pstep .ssub{margin-top:6px;font-size:17px;color:var(--violet-d);}
  #pstep .cnt{font-size:14px;font-weight:700;color:var(--violet-d);margin-bottom:6px;}
  .nav{display:flex;gap:10px;}
  .nav button{flex:1;min-height:56px;border-radius:14px;border:0;font-weight:800;font-size:18px;background:var(--orchid);color:var(--indigo);}
  .nav button.alt{background:transparent;border:2px solid var(--peri);color:var(--mist);}
  .nav button:disabled{opacity:.45;cursor:default;}
  /* ended */
  #ended{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 20px;text-align:center;background:var(--indigo);color:var(--mist);}
  #ended img{width:min(220px,55vw);border-radius:50%;border:4px solid var(--orchid);}
  #ended h1{color:var(--mist);}
  #ended p{font-size:18px;max-width:520px;}
  #ended .langsw{margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <div id="loading" role="status" aria-live="polite">Loading…</div>
</div>
<script>
(function(){
  "use strict";
  var SB={url:"https://pebhikfbpgntedvbxqph.supabase.co",key:"sb_publishable_7wnGQX91msxCwzq7QRqF1w_MWfgWCWT"};
  var RECHECK_MS=30*60*1000, TIMEOUT_MS=5000;
  var UI={
    en:{title:"Pick a calm-down for your class",sub:"Tap one. Hani or Gani guides it, step by step.",beta:"Spanish is BETA: unreviewed machine draft.",
        back:"‹ Back to board",next:"Next ›",prev:"‹ Back",step:"Step {a} of {b}",soon:"Video coming soon",silent:"Captions only, no sound",enonly:"English only",
        guided:"Guided steps",video:"Video",ended:"This demo has ended. Thank you for trying Hani!",contact:"Ask your HudsonSeed contact for a new link",
        loading:"Loading…",yoga:"Yoga",langlabel:"Language",espronto:"Español pronto",vidFail:"Video not available yet. Follow the guided steps below.",finish:"Done ✓",
        gani:"Guide: Gani",hani:"Guide: Hani"},
    es:{title:"Elige una pausa para tu clase",sub:"Toca una. Hani o Gani la guía, paso a paso.",beta:"El español es BETA: borrador automático sin revisar.",
        back:"‹ Volver al tablero",next:"Siguiente ›",prev:"‹ Atrás",step:"Paso {a} de {b}",soon:"Video próximamente",silent:"Solo subtítulos, sin sonido",enonly:"Solo en inglés",
        guided:"Pasos guiados",video:"Video",ended:"Esta demostración ha terminado. ¡Gracias por probar Hani!",contact:"Pide un enlace nuevo a tu contacto de HudsonSeed",
        loading:"Cargando…",yoga:"Yoga",langlabel:"Idioma",espronto:"Español pronto",vidFail:"El video aún no está disponible. Sigue los pasos guiados.",finish:"Listo ✓",
        gani:"Guía: Gani",hani:"Guía: Hani"}
  };
  var app=document.getElementById("app");
  var lang="en", tiles=null, state="loading", pendingEnd=false, playerOpen=false, endMsg={en:null,es:null}, timer=null, activeVideo=null;

  function getLang(){
    try{var s=localStorage.getItem("hani_lang");if(s==="en"||s==="es")return s;}catch(e){}
    return (navigator.language||"").toLowerCase().indexOf("es")===0?"es":"en";
  }
  function setLang(l){lang=l;try{localStorage.setItem("hani_lang",l);}catch(e){}document.documentElement.lang=l;render();}
  function t(k){return UI[lang][k];}
  function el(tag,attrs,kids){var n=document.createElement(tag);for(var k in (attrs||{})){if(k==="text")n.textContent=attrs[k];else if(k==="class")n.className=attrs[k];else n.setAttribute(k,attrs[k]);}
    (kids||[]).forEach(function(c){if(c)n.appendChild(c);});return n;}
  function langSwitch(){
    var w=el("div",{class:"langsw",role:"group","aria-label":t("langlabel")});
    ["en","es"].forEach(function(l){var b=el("button",{type:"button","aria-pressed":String(lang===l),text:l.toUpperCase()});
      b.addEventListener("click",function(){setLang(l);});w.appendChild(b);});
    return w;
  }

  /* ---------- kill switch ---------- */
  function token(){try{return new URLSearchParams(location.search).get("k")||"";}catch(e){return "";}}
  function fetchStatus(tok){
    var ctl=new AbortController(), to=setTimeout(function(){ctl.abort();},TIMEOUT_MS);
    return fetch(SB.url+"/rest/v1/rpc/board_link_status",{method:"POST",cache:"no-store",signal:ctl.signal,
      headers:{"apikey":SB.key,"Authorization":"Bearer "+SB.key,"Content-Type":"application/json"},body:JSON.stringify({p_token:tok})})
      .then(function(r){clearTimeout(to);if(!r.ok)throw new Error("status "+r.status);return r.json();},function(e){clearTimeout(to);throw e;});
  }
  function checkStatus(){
    var tok=token();
    if(!tok)return Promise.resolve({active:false});
    return fetchStatus(tok).catch(function(){return fetchStatus(tok);}).catch(function(){return {active:false,failed:true};});
  }
  function applyStatus(s){
    if(s&&s.msg_en)endMsg.en=s.msg_en; if(s&&s.msg_es)endMsg.es=s.msg_es;
    if(s&&s.active===true){return true;}
    return false;
  }
  function recheck(){
    if(state==="ended")return;
    checkStatus().then(function(s){
      if(applyStatus(s))return;
      // flipped off mid-session: let the current video finish, then end
      if(playerOpen&&activeVideo&&!activeVideo.ended&&!activeVideo.paused){pendingEnd=true;activeVideo.addEventListener("ended",showEnded,{once:true});return;}
      showEnded();
    });
  }
  function showEnded(){
    state="ended";tiles=null;playerOpen=false;pendingEnd=false;activeVideo=null;render();
  }

  /* ---------- render ---------- */
  function render(){
    app.textContent="";
    if(state==="ended"){
      var e=el("div",{id:"ended",role:"main"});
      var im=el("img",{src:"hanuman-smiling.jpg",alt:"Hani waving"});
      e.appendChild(im);
      e.appendChild(el("h1",{text:endMsg[lang]||UI[lang].ended}));
      e.appendChild(el("p",{text:t("contact")}));
      e.appendChild(langSwitch());
      app.appendChild(e);return;
    }
    if(state!=="ready"){app.appendChild(el("div",{id:"loading",role:"status","aria-live":"polite",text:t("loading")}));return;}
    var top=el("div",{id:"topbar"},[el("div",{id:"brand"},[document.createTextNode("Hani"),el("small",{text:"DEMO"})]),langSwitch()]);
    app.appendChild(top);
    var main=el("main");
    main.appendChild(el("h1",{text:t("title")}));
    main.appendChild(el("p",{class:"sub",text:t("sub")}));
    if(lang==="es")main.appendChild(el("span",{class:"beta",text:t("beta")}));
    var ul=el("ul",{id:"grid"});
    tiles.forEach(function(tl){ul.appendChild(el("li",{},[tileBtn(tl)]));});
    main.appendChild(ul);app.appendChild(main);
  }
  function chipsFor(tl){
    var c=[];
    c.push(el("span",{class:"chip soft",text:tl.character==="Gani"?t("gani"):t("hani")}));
    if(tl.silent)c.push(el("span",{class:"chip",text:t("silent")}));
    if(!tl.video)c.push(el("span",{class:"chip",text:t("soon")}));
    if(tl.video&&lang==="es"&&!tl.video.es)c.push(el("span",{class:"chip",text:tl.id==="triangle"?t("enonly"):t("espronto")}));
    return c;
  }
  function tileBtn(tl){
    var th=el("div",{class:"thumb"});
    var src=tl.character==="Gani"?tl.still:tl.poster;
    if(src){var im=el("img",{src:src,alt:"",loading:"lazy"});im.addEventListener("error",function(){im.remove();th.appendChild(el("span",{class:"ph",text:tl.character}));});th.appendChild(im);}
    var b=el("button",{type:"button",class:"tile","aria-label":tl.name[lang]+". "+tl.blurb[lang]},[
      th,el("div",{class:"tbody"},[el("div",{class:"tname",text:tl.name[lang]}),
        el("div",{class:"tmeta",text:tl.audience[lang]+" · "+tl.tag[lang]}),
        el("div",{class:"tblurb",text:tl.blurb[lang]}),el("div",{class:"chips"},chipsFor(tl))])]);
    b.addEventListener("click",function(){openPlayer(tl);});
    return b;
  }

  /* ---------- player ---------- */
  function openPlayer(tl){
    playerOpen=true;var idx=0;
    var p=el("div",{id:"player",role:"dialog","aria-modal":"true","aria-label":tl.name[lang]});
    var inner=el("div",{class:"inner"});
    var back=el("button",{id:"pback",type:"button",text:t("back")});
    var media=el("div",{id:"pmedia"});
    var step=el("div",{id:"pstep","aria-live":"polite"});
    var nav=el("div",{class:"nav"});
    var prev=el("button",{type:"button",class:"alt",text:t("prev")}),next=el("button",{type:"button",text:t("next")});
    nav.appendChild(prev);nav.appendChild(next);
    inner.appendChild(back);inner.appendChild(el("h2",{id:"pname",text:tl.name[lang]}));
    inner.appendChild(media);
    inner.appendChild(el("div",{class:"chips"},chipsFor(tl)));
    if(tl.intro)inner.appendChild(el("p",{id:"pintro",text:tl.intro[lang]}));
    inner.appendChild(step);inner.appendChild(nav);p.appendChild(inner);app.appendChild(p);
    function paint(){
      var s=tl.steps[idx][lang];step.textContent="";
      step.appendChild(el("div",{class:"cnt",text:t("step").replace("{a}",idx+1).replace("{b}",tl.steps.length)}));
      step.appendChild(el("div",{class:"cue",text:s.cue}));if(s.sub)step.appendChild(el("div",{class:"ssub",text:s.sub}));
      prev.disabled=idx===0;next.textContent=idx===tl.steps.length-1?t("finish"):t("next");
    }
    prev.addEventListener("click",function(){if(idx>0){idx--;paint();}});
    next.addEventListener("click",function(){if(idx<tl.steps.length-1){idx++;paint();}else close();});
    function close(){
      if(activeVideo){try{activeVideo.pause();}catch(e){}activeVideo=null;}
      playerOpen=false;p.remove();if(pendingEnd){showEnded();return;}
    }
    back.addEventListener("click",close);
    p.addEventListener("keydown",function(e){if(e.key==="Escape")close();});
    // media
    var vsrc=tl.video?(tl.video[lang]||tl.video.en):null;
    if(vsrc){
      var v=el("video",{controls:"",playsinline:"",preload:"metadata","aria-label":tl.name[lang]});
      if(tl.poster)v.setAttribute("poster",tl.poster);
      v.addEventListener("error",function(){fallback(true);});
      v.src=vsrc;media.appendChild(v);activeVideo=v;
    }else fallback(false);
    function fallback(failed){
      activeVideo=null;media.textContent="";
      var src=tl.character==="Gani"?tl.still:tl.poster;
      if(src){var im=el("img",{src:src,alt:""});im.addEventListener("error",function(){media.textContent="";media.appendChild(el("div",{class:"ph",text:tl.character}));});media.appendChild(im);}
      else media.appendChild(el("div",{class:"ph",text:tl.character}));
      if(failed)inner.insertBefore(el("p",{id:"pintro",text:t("vidFail")}),step);
    }
    paint();back.focus();
  }

  /* ---------- boot ---------- */
  lang=getLang();document.documentElement.lang=lang;render();
  checkStatus().then(function(s){
    if(!applyStatus(s)){showEnded();return;}
    return fetch("assets/mvp-board.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
      tiles=d.tiles.slice().sort(function(a,b){return a.order-b.order;});state="ready";render();
      timer=setInterval(recheck,RECHECK_MS);
      document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")recheck();});
    }).catch(function(){showEnded();});
  });
  window.__hmvp={recheck:recheck,RECHECK_MS:RECHECK_MS};
})();
</script>
</body>
</html>
